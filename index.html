<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Challenger IA — Intelligence Critique</title>
    <meta name="description" content="Challenger IA — L'outil de pensée analytique qui questionne vos certitudes. Maïeutique numérique par Stariax Group." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F0F4FF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Challenger IA" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap"
      rel="stylesheet"
    />
    <!-- Préférences d'accessibilité appliquées AVANT le premier rendu : posées
         depuis React, l'agrandissement du texte et le contraste renforcé
         provoqueraient un ressaut visible à chaque chargement. -->
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('challenger:a11y') || '{}');
          var e = { normal: 1, grand: 1.15, 'tres-grand': 1.3 }[p.tailleTexte] || 1;
          var r = document.documentElement;
          r.style.setProperty('--echelle-texte', String(e));
          r.dataset.contraste = p.contrasteRenforce ? 'renforce' : 'normal';
          var sys = matchMedia('(prefers-reduced-motion: reduce)').matches;
          r.dataset.mouvement =
            p.mouvement === 'reduit' || (p.mouvement !== 'complet' && sys) ? 'reduit' : 'complet';
        } catch (_) { /* préférences illisibles : on garde les valeurs par défaut */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
